<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 8 - Server Interaction</title>
</head>
<body>

    <h1>Server Interaction</h1>

    <section>
        <h2>1. Advice Search</h2>
        <input type="text" id="advice-input" placeholder="Enter a keyword">
        <button id="advice-button">Search Advice</button>
        <div id="advice-container"></div>
    </section>

    <section>
        <h2>2. Dog Breeds</h2>
        <button id="breeds-button">Load Dog Breeds</button>
        <ul id="breed-list"></ul>
    </section>

    <section>
        <h2>3. Random Quote</h2>
        <button id="quote-button">Get Random Quote</button>
        <div id="quote-container"></div>
    </section>

    <section>
        <h2>4. Country Information</h2>
        <input type="text" id="country-input" placeholder="Enter country name">
        <button id="country-button">Search Country</button>
        <div id="country-info"></div>
    </section>

    <script src="main.js"></script>
</body>
</html>
